[project]
name = "nde"
version = "0.1.0"
description = "Narrative Diffusion Engine: research tooling for structured story planning."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "barnabyg" }]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
nde = "nde.cli:main"
nde-verify = "nde.verify:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nde"]

[tool.uv]
# Only the dev group is installed by `uv sync`. Optional ML dependencies are
# installed explicitly with `uv sync --group ml`.
default-groups = ["dev"]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "pip-audit==2.10.1",
    "pyright[nodejs]==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "types-pyyaml==6.0.12.20260906",
]
ml = [
    "torch==2.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Gate 2 (lint) runs this whole selection; gate 4 (static bug analysis) runs
# only B and S. See src/nde/verify/gates.py.
select = [
    "E", "W", "F", "I", "N", "UP", "A", "C4", "SIM", "RUF", "PT", "PTH", "RET", "ARG", "PL",
    "B", "S",
]

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assertion rewriting is the idiomatic way to assert in tests.
# PLR2004: literal expected values in tests are the specification, not magic numbers.
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not live"]
markers = [
    "live: calls a real LLM provider; opt in with `uv run pytest -m live`",
]
filterwarnings = ["error"]
