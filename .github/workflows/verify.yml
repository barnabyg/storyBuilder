name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Canonical verification
        run: uv run --locked nde-verify
