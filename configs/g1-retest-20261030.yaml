# The one permitted G1 follow-up: see docs/g1-four-pairs.md. Fresh briefs, a stronger
# model in both conditions and the same editing passes for both. Prices are the peak
# rates on https://api-docs.deepseek.com/quick_start/pricing, checked 30 October 2026.
name: g1-retest-20261030-v1
seed: 1800
prompts_dir: ../prompts
providers:
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY # pragma: allowlist secret - environment-variable name, no key value
    json_schema: false
    timeout_s: 300
    retry:
      max_retries: 1
      base_delay_s: 1
      max_delay_s: 10
roles:
  planner:
    provider: deepseek
    model: deepseek-v4-pro
    family: deepseek
    params:
      thinking:
        type: disabled
      temperature: 0.7
      max_tokens: 16000
  prose:
    provider: deepseek
    model: deepseek-v4-pro
    family: deepseek
    params:
      thinking:
        type: disabled
      temperature: 0.8
      max_tokens: 5000
stories:
  briefs_dir: ../benchmark
  briefs:
    ids:
    - brief-11
    - brief-12
    - brief-13
    - brief-14
  repeat: 1
  length:
    tolerance: 0.1
    max_attempts: 8
  conditions:
  - name: C
    pipeline: baseline_c
    params:
      tier: M
      skeleton_prompt:
        template: plan_skeleton
        version: 2
      channels_prompt:
        template: plan_channels
        version: 2
  - name: B
    pipeline: baseline_b
  equal_budget:
    conditions:
    - C
    - B
    tolerance: 0.9
    max_revision_passes: 2
    fixed_revision_passes: 2
structured:
  max_repairs: 3
prices:
  deepseek/deepseek-v4-pro:
    input_per_mtok: 1.32
    output_per_mtok: 3.96
budget:
  per_run_usd: 3.0
  per_day_usd: 4.0
