# The one permitted G1 follow-up: see docs/g1-four-pairs.md. Fresh briefs, a stronger
# model in both conditions and the same editing passes for both. Prices are the standard
# rates on https://developers.openai.com/api/docs/pricing, checked 30 October 2026.
# A reasoning model: max_completion_tokens also bounds the reasoning tokens.
name: g1-retest-20261030-v1
seed: 1800
prompts_dir: ../prompts
providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY # pragma: allowlist secret - environment-variable name, no key value
    json_schema: false
    timeout_s: 300
    retry:
      max_retries: 1
      base_delay_s: 1
      max_delay_s: 10
roles:
  planner:
    provider: openai
    model: gpt-6.1-sol
    family: openai
    params:
      reasoning_effort: medium
      max_completion_tokens: 32000
  prose:
    provider: openai
    model: gpt-6.1-sol
    family: openai
    params:
      reasoning_effort: medium
      max_completion_tokens: 12000
stories:
  briefs_dir: ../benchmark
  briefs:
    ids:
    - brief-11
    - brief-12
    - brief-13
    - brief-14
  repeat: 1
  length:
    tolerance: 0.1
    max_attempts: 8
  conditions:
  - name: C
    pipeline: baseline_c
    params:
      tier: M
      skeleton_prompt:
        template: plan_skeleton
        version: 2
      channels_prompt:
        template: plan_channels
        version: 2
  - name: B
    pipeline: baseline_b
  equal_budget:
    conditions:
    - C
    - B
    tolerance: 0.9
    max_revision_passes: 2
    fixed_revision_passes: 2
structured:
  max_repairs: 3
prices:
  openai/gpt-6.1-sol:
    input_per_mtok: 2.0
    output_per_mtok: 10.0
budget:
  per_run_usd: 3.0
  per_day_usd: 4.0
