# Dev-only structured planning; uses the Phase 0 planner binding.
# uv run nde plan generate configs/plans-c.yaml
name: plans-c
seed: 1700
prompts_dir: ../prompts
providers:
  openai:
    base_url: https://api.openai.com/v1
    base_url_env: NDE_OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY # pragma: allowlist secret - environment variable name
    json_schema: true
    timeout_s: 180
roles:
  planner:
    provider: openai
    model: gpt-6-luna
    family: openai
    params: {reasoning_effort: none, temperature: 0.7, max_completion_tokens: 10000}
plans:
  briefs_dir: ../benchmark
  briefs: {ids: [brief-01]}
  repeat: 1
structured:
  max_repairs: 2
prices:
  # Same illustrative rates as configs/stories-ab.yaml; verify before a paid run.
  openai/gpt-6-luna: {input_per_mtok: 0.10, output_per_mtok: 0.50}
budget:
  per_run_usd: 0.50
  per_day_usd: 5.00
