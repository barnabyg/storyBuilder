# Smoke experiment: one call to the `prose` role, recorded as a run.
#
#   uv run nde run configs/smoke.yaml
#
# Needs DEEPSEEK_API_KEY in the environment or in `.env` (see .env.example).
name: smoke
seed: 20261018
prompts_dir: ../prompts

providers:
  deepseek:
    base_url: https://api.deepseek.com/v1
    # Optional override, e.g. to point at a proxy or a test server.
    base_url_env: NDE_DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY  # pragma: allowlist secret - a variable name, not a key

roles:
  prose:
    provider: deepseek
    model: deepseek-flash
    # deepseek-flash thinks by default, and ignores temperature while it does;
    # disable thinking for plain, comparable completions.
    params:
      thinking: {type: disabled}
      temperature: 0.7
      max_tokens: 200

calls:
  - id: opening-line
    role: prose
    prompt: {template: smoke, version: 1}
    variables:
      setting: a lighthouse in a storm

# USD per million tokens, per provider/model. Prices change: check the
# provider's current price list before relying on these numbers.
prices:
  # DeepSeek pricing page, checked 2026-10-18: peak rates (off-peak is half),
  # cache-miss input, so recorded costs and budget checks err on the high side.
  deepseek/deepseek-flash: {input_per_mtok: 0.30, output_per_mtok: 1.20}

budget:
  per_run_usd: 0.01
  per_day_usd: 1.00
