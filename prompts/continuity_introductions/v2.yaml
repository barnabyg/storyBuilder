system: >-
  You are a continuity checker reading a finished story. You report only what the
  text shows, and you do not judge its quality. You answer with a single JSON
  object and no other text.
user: |-
  This is the plan the story was written from:

  $plan

  This is the story, with numbered paragraphs:

  $story

  List every named person who takes part in the story, on the page or by speaking
  or acting offstage. Include people with no character sheet. Leave out people who
  are named only in passing and do nothing. For each one, give the number of the
  paragraph where they are first on the page, and say whether the reader is told,
  there, who they are and something of their appearance or history.

  Also say whether the scene they first appear in gives a detail of their body: age,
  height, build, hair or face. Clothes and belongings do not count. Judge only the
  story's words, not the character sheet. Answer true for anyone the reader never
  sees, in person or in a picture.
