system: >-
  You are a continuity checker reading a finished story. You report only what the
  text shows, and you do not judge its quality. You answer with a single JSON
  object and no other text.
user: |-
  This is the plan the story was written from, with its scene clock:

  $plan

  This is the story, with numbered paragraphs:

  $story

  List every event whose time the prose states or clearly implies, especially
  physical processes: food spoiling, wounds healing, journeys, weather, people
  tiring, and work being done. For each one, give the minutes the prose allows it
  and, from what happens in the real world, the least and most time it could
  take. If a person smells food turning sour four minutes after a power cut, the
  prose gives it 4 minutes, and it could take from 720 to 4,320 minutes. Use the
  plan's label if the event is one of its key events. Do not list events whose
  time the prose leaves open.

  Also list each scene where the prose says how much time has passed since the
  scene before.
